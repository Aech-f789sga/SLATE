org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# Release identity. Bump these for every APK you hand out, otherwise Android
# will refuse to install the new build over the old one.
#
#   slateVersionCode  integer, must strictly increase
#   slateVersionName  human readable, shown in the app
#
# CI overrides these from the git tag / run number (see .github/workflows).
# ---------------------------------------------------------------------------
slateVersionCode=1
slateVersionName=1.0.0

# ---------------------------------------------------------------------------
# Fallback URL used only on the very first launch, before the release channel
# has been read from Firestore. After that the approved URL from Firestore
# always wins, so you should never need to rebuild the APK to ship web changes.
# ---------------------------------------------------------------------------
slateDefaultUrl=https://slate-omega-henna.vercel.app

# ---------------------------------------------------------------------------
# Optional: native Google Sign-In (see README "Google sign-in").
# Paste the *web* OAuth client ID from your Firebase project here to enable the
# native account picker inside the APK. Leave empty to disable it.
# ---------------------------------------------------------------------------
slateGoogleClientId=
