<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="slateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="stylusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect width="512" height="512" rx="112" fill="url(#slateBg)"/>

  <!-- Notebook Spine & Base shadow -->
  <g filter="url(#dropShadow)">
    <!-- Book Back Cover -->
    <rect x="86" y="86" width="310" height="340" rx="20" fill="#1e293b"/>
    <!-- Book Front Cover -->
    <rect x="94" y="90" width="296" height="332" rx="18" fill="url(#coverGrad)"/>
    <!-- Page Insert -->
    <rect x="136" y="112" width="236" height="288" rx="6" fill="url(#pageGrad)"/>
    <!-- Ruled Lines on Page -->
    <line x1="156" y1="160" x2="350" y2="160" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="200" x2="350" y2="200" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="240" x2="350" y2="240" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="280" x2="350" y2="280" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <line x1="156" y1="320" x2="350" y2="320" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <!-- Margin Line -->
    <line x1="190" y1="120" x2="190" y2="390" stroke="#fca5a5" stroke-width="3"/>
    
    <!-- Smooth Drawn Signature Wave -->
    <path d="M 205 235 Q 235 180 260 230 T 315 220 T 345 235" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Precision Stylus Pen laying diagonally across -->
  <g transform="rotate(28 320 280)" filter="url(#dropShadow)">
    <!-- Pen Body -->
    <rect x="306" y="100" width="24" height="260" rx="12" fill="url(#stylusGrad)"/>
    <rect x="312" y="106" width="12" height="248" rx="6" fill="#f1f5f9" opacity="0.6"/>
    <!-- Pen Grip Band -->
    <rect x="306" y="270" width="24" height="40" fill="#334155"/>
    <!-- Stylus Nib Cone -->
    <polygon points="306,360 330,360 318,396" fill="#1e293b"/>
    <!-- Fine Tip -->
    <circle cx="318" cy="397" r="4" fill="#38bdf8"/>
  </g>
</svg>
